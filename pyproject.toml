[tool.poetry]
name = "tbd"
version = "1.0.0"
description = "Machine learning for fluid mechanics"
readme = ["README.md", "LICENSE"]
license = "MIT"
authors = ["Sotiris Catsoulis <scatsoulis@caltech.edu>"]
repository = "https://github.com/scatsoulis/tbd"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
numpy = "=2.2.0"
matplotlib = "3.10.3"
scipy = "1.15.3"
joblib = "1.3.2"
torch = {version = "^2.7.0", optional = true}
scikit-learn = "1.4.0"
psutil = "5.9.8"
tqdm = "4.66.2"
h5py = "3.10.0"
ruff = ">=0.2.1"
pre-commit = ">=3.6.2"
pyfftw = "^0.15.0"
torchvision = "^0.22.0"
torchaudio = "^2.7.0"
jax = "^0.6.1"

[tool.build-system]
requires = ["poetry-core > 1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select=["E", "F", "W", "N","UP","S","PL","B","ANN","A","C4","RET","SIM","TCH"]
extend-select = ["E501"]
ignore = ["E402", "ANN101", "RET504", "PLR0913", "PLR0915", "N803", "N806"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20
